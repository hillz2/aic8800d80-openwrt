name: debug-host

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: "24.10.3"
    steps:
      - name: Inspect gnu-coreutils layout
        run: |
          dpkg -L gnu-coreutils | grep -E '/install$|/bin/' | head -40
          echo "--- /usr/libexec ---"
          ls -l /usr/libexec/ 2>/dev/null | head -20
          echo "--- alternatives ---"
          ls -l /etc/alternatives/ 2>/dev/null | grep -i install | head

      - name: Download and extract gnu-coreutils deb
        run: |
          set -eux
          mkdir -p /tmp/deb /tmp/gnu
          cd /tmp/deb
          apt-get download gnu-coreutils
          ls -l
          dpkg-deb -x gnu-coreutils_*.deb /tmp/gnu
          find /tmp/gnu -type f -name install
          find /tmp/gnu -type f -name install -exec {} --version \; | head -2

      - name: Prereq check with GNU install shim
        run: |
          set -eux
          gnu=$(find /tmp/gnu -type f -name install | head -n1)
          mkdir -p /tmp/gnubin
          ln -sf "$gnu" /tmp/gnubin/install
          export PATH=/tmp/gnubin:$PATH
          command -v install
          install --version | head -1
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/ath79/generic"
          SDK=$(wget -qO- "$BASE/" | grep -oE 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.zst' | head -n1)
          test -n "$SDK"
          wget -q "$BASE/$SDK"
          tar --zstd -xf "$SDK"
          mv "${SDK%.tar.zst}" sdk
          cd sdk
          make defconfig 2>&1 | tail -30
          grep -E '^CONFIG_PACKAGE_kmod-(mac80211|cfg80211)|^CONFIG_TARGET_(PROFILE|SUBTARGET)' .config || true
