name: debug-host

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: "24.10.3"
    steps:
      - name: Facts
        run: |
          ls -l /usr/bin/install /usr/bin/ginstall 2>&1 || true
          dpkg -S /usr/bin/install 2>&1 || true
          dpkg -l | grep -E 'coreutils|rust-coreutils' || true
          apt-cache policy coreutils | head -10

      - name: Extract GNU install from coreutils .deb
        run: |
          set -x
          mkdir -p /tmp/deb /tmp/gnu
          cd /tmp/deb
          apt-get download coreutils 2>&1 | tail -3
          ls -l
          for d in coreutils_*.deb; do dpkg-deb -x "$d" /tmp/gnu; done
          find /tmp/gnu -name 'install' -o -name 'ginstall' | head
          install_gnu=$(find /tmp/gnu -type f -name install | head -n1)
          echo "GNU install: $install_gnu"
          "$install_gnu" --version | head -2

      - name: Verify prereq passes with GNU install first on PATH
        run: |
          set -e
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/ath79/generic"
          SDK=$(wget -qO- "$BASE/" | grep -oE 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.zst' | head -n1)
          test -n "$SDK"
          wget -q "$BASE/$SDK"
          tar --zstd -xf "$SDK"
          mv "${SDK%.tar.zst}" sdk
          mkdir -p /tmp/gnubin
          gnu=$(find /tmp/gnu -type f -name install | head -n1)
          ln -sf "$gnu" /tmp/gnubin/install
          export PATH=/tmp/gnubin:$PATH
          command -v install
          install --version | head -1
          cd sdk
          make defconfig 2>&1 | tail -25
          grep -E '^CONFIG_PACKAGE_kmod-(mac80211|cfg80211)|^CONFIG_TARGET_PROFILE' .config || true