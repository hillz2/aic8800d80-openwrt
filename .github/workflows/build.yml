name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      driver_ref:
        description: "Driver git ref to build (empty = the pinned commit; use legacy-mcu1 for chip_mcu_id=1)"
        required: false
        default: ""
      releases:
        description: "Space-separated OpenWrt 25.12.x releases to build (empty = all supported)"
        required: false
        default: ""

permissions:
  contents: write

# A newer push supersedes an older run. Tags are exempt so an in-flight publish
# is never cancelled half way through creating a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Kernel modules are vermagic-locked to the exact kernel build, so a single
  # artifact can never install across OpenWrt point releases. Build one job per
  # supported release instead. These are the 25.12.x releases and the kernel
  # each ships for ath79 (modules only load when both match):
  #   25.12.0 6.12.71   25.12.1 6.12.74   25.12.2 6.12.74   25.12.3 6.12.85
  #   25.12.4 6.12.87   25.12.5 6.12.94   25.12.6 6.12.112
  prepare:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          REQUESTED: ${{ inputs.releases }}
        run: |
          ALL="25.12.0 25.12.1 25.12.2 25.12.3 25.12.4 25.12.5 25.12.6"
          want="${REQUESTED:-$ALL}"
          entries=""
          for v in $want; do
            case " $ALL " in
              *" $v "*) ;;
              *) echo "ERROR: unsupported release '$v' (known: $ALL)" >&2; exit 1 ;;
            esac
            entries="$entries{\"name\":\"ath79-generic-$v\",\"version\":\"$v\",\"target\":\"ath79\",\"subtarget\":\"generic\"},"
          done
          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      # 25.12 ships Linux 6.12 for ath79, so the driver's LINUX_VERSION_CODE
      # gates finally agree with the cfg80211 backports version. On 24.10 the
      # kernel is 6.6 while cfg80211 is 6.12, and 60+ call sites pick the
      # wrong ABI.
      # 25.12 builds .apk by default (CONFIG_USE_APK=y); 24.10 built .ipk.
      PKG_EXT: apk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates file gawk gettext git libncurses-dev \
            libssl-dev python3 rsync unzip wget zlib1g-dev zstd

      - name: Ensure GNU coreutils on PATH
        run: |
          # Recent ubuntu-latest images ship uutils coreutils, whose `install`
          # does not identify as GNU and therefore fails OpenWrt's
          # prerequisite check. GNU coreutils is still installed under
          # /usr/bin/gnu*, so expose it under a normal prefix.
          if install --version 2>/dev/null | grep -q GNU; then
            echo "host install is already GNU coreutils"
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends gnu-coreutils || true
          mkdir -p "$HOME/gnubin"
          if [ -x /usr/bin/gnuinstall ]; then
            ln -sf /usr/bin/gnuinstall "$HOME/gnubin/install"
          fi
          dpkg -L gnu-coreutils 2>/dev/null | grep -E '^/usr/bin/gnu[^/]+$' | while read -r bin; do
            name=${bin##*/}
            name=${name#gnu}
            [ -n "$name" ] && ln -sf "$bin" "$HOME/gnubin/$name"
          done
          "$HOME/gnubin/install" --version | grep GNU
          echo "$HOME/gnubin" >> "$GITHUB_PATH"

      - name: Download OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/${{ matrix.target }}/${{ matrix.subtarget }}"
          SDK=$(wget -qO- "$BASE/" | grep -oE 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.zst' | head -n1)
          test -n "$SDK"
          echo "Using $SDK"
          wget -q "$BASE/$SDK"
          tar --zstd -xf "$SDK"
          mv "${SDK%.tar.zst}" sdk

      - name: Add mac80211 and driver packages
        run: |
          # The SDK ships no wireless stack: package/kernel/mac80211 is absent,
          # staging_dir has no mac80211 headers and there are no prebuilt
          # kmod-cfg80211/kmod-mac80211 packages. Fetch the package from the
          # matching OpenWrt tag so the backport headers and Module.symvers the
          # driver needs are built from the same source release.
          git clone --quiet --depth 1 --branch "v${{ matrix.version }}" \
            --filter=blob:none --sparse \
            https://github.com/openwrt/openwrt.git "$RUNNER_TEMP/openwrt"
          git -C "$RUNNER_TEMP/openwrt" sparse-checkout set package/kernel/mac80211
          mkdir -p sdk/package/kernel
          cp -r "$RUNNER_TEMP/openwrt/package/kernel/mac80211" sdk/package/kernel/mac80211

          cp -r package/aic8800d80 sdk/package/aic8800d80
          cp -r package/aic8800d80-firmware sdk/package/aic8800d80-firmware

          # Rebuilding from a different driver ref (e.g. legacy-mcu1) is useful
          # for chip_mcu_id=1 hardware; rewrite the pin in the SDK copy only.
          ref="${{ inputs.driver_ref }}"
          if [ -n "$ref" ]; then
            sha=$(git ls-remote https://github.com/shenmintao/aic8800d80.git "$ref" | head -n1 | cut -f1)
            test -n "$sha"
            echo "Building driver ref '$ref' at $sha"
            for mk in sdk/package/aic8800d80/Makefile sdk/package/aic8800d80-firmware/Makefile; do
              sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$sha/" "$mk"
              sed -i "s/^PKG_SOURCE_DATE:=.*/PKG_SOURCE_DATE:=$(date -u +%F)/" "$mk"
            done
          fi

          ls sdk/package/kernel/mac80211/Makefile
          echo "mac80211 PKG_VERSION: $(grep -m1 '^PKG_VERSION:=' sdk/package/kernel/mac80211/Makefile)"
          echo "driver CFG80211 version: $(grep -m1 '^AIC_CFG80211_VERSION:=' sdk/package/aic8800d80/Makefile)"

      - name: Configure
        run: |
          cd sdk
          rm -rf tmp
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-aic8800d80=y
          CONFIG_PACKAGE_aic8800d80-firmware=y
          EOF
          make defconfig
          for sym in kmod-cfg80211 kmod-mac80211 kmod-usb-core kmod-aic8800d80 aic8800d80-firmware; do
            grep -qE "^CONFIG_PACKAGE_${sym}=[ym]$" .config || {
              echo "ERROR: CONFIG_PACKAGE_${sym} was not enabled" >&2
              exit 1
            }
          done
          grep -E '^CONFIG_PACKAGE_(kmod-(cfg80211|mac80211|usb-core|aic8800d80)|aic8800d80-firmware)=' .config
          # Package format decides the artifact extension; keep it explicit.
          grep -q '^CONFIG_USE_APK=y' .config || {
            echo "ERROR: CONFIG_USE_APK=y was not set, artifact extension would differ" >&2
            exit 1
          }

      - name: Build wireless stack
        run: |
          cd sdk
          make package/kernel/mac80211/compile V=s -j"$(nproc)"
          # The driver builds against the staged backport headers and the
          # mac80211 Module.symvers; fail here if either is missing.
          test -f staging_dir/target-*/usr/include/mac80211-backport/backport/autoconf.h
          ls build_dir/target-*/linux-*/symvers/

      - name: Build AIC8800D80 packages
        run: |
          cd sdk
          make package/aic8800d80/compile V=s -j"$(nproc)"
          make package/aic8800d80-firmware/compile V=s -j"$(nproc)"

      - name: Collect packages
        run: |
          mkdir -p out
          for pkg in kmod-cfg80211 kmod-mac80211 kmod-usb-core kmod-aic8800d80 aic8800d80-firmware; do
            found=$(find sdk/bin -type f \( -name "${pkg}_*.ipk" -o -name "${pkg}-*.apk" \) | head -n1)
            if [ -n "$found" ]; then
              cp -v "$found" out/
            else
              echo "WARNING: no package produced for ${pkg}"
            fi
          done
          ls -l out
          test -n "$(ls -A out)"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: aic8800d80-${{ matrix.name }}
          path: |
            out/*.apk
            out/*.ipk
          if-no-files-found: error

  # Publishing is a separate job so the matrix jobs never race each other
  # creating the release, and so the identical firmware package (which does not
  # depend on the kernel) is only attached once.
  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          find dist -type f \( -name '*.apk' -o -name '*.ipk' \) -print0 |
            while IFS= read -r -d '' f; do
              b=$(basename "$f")
              if [ ! -e "out/$b" ]; then
                cp "$f" "out/$b"
              fi
            done
          ls -l out
          test -n "$(ls -A out)"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" out/* --clobber \
            || gh release create "$GITHUB_REF_NAME" out/* --generate-notes --verify-tag