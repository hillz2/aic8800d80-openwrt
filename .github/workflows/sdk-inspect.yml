name: sdk-inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: "24.10.3"
    steps:
      - name: Download SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/ath79/generic"
          SDK=$(wget -qO- "$BASE/" | grep -oE 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.zst' | head -n1)
          wget -q "$BASE/$SDK"
          tar --zstd -xf "$SDK"
          mv "${SDK%.tar.zst}" sdk

      - name: SDK README and Makefile
        run: |
          echo "=== README.md ==="
          cat sdk/README.md
          echo "=== Makefile ==="
          cat sdk/Makefile
          echo "=== feeds.conf.default ==="
          cat sdk/feeds.conf.default

      - name: target/linux contents
        run: |
          echo "=== target/linux (depth 2) ==="
          find sdk/target/linux -maxdepth 2 | head -40
          echo "=== target/linux/ath79 ==="
          ls sdk/target/linux/ath79 2>/dev/null || echo "(none)"
          echo "=== generic config present? ==="
          ls sdk/target/linux/generic/config-6.6 2>/dev/null || echo "(no generic config)"

      - name: package/kernel/linux and package/Makefile
        run: |
          echo "=== package/kernel/linux ==="
          ls sdk/package/kernel/linux
          echo "=== package/kernel/linux/modules ==="
          ls sdk/package/kernel/linux/modules 2>/dev/null | head -20
          echo "=== package/Makefile ==="
          cat sdk/package/Makefile