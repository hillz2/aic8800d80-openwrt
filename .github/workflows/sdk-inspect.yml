name: sdk-inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: "24.10.3"
    steps:
      - name: Download SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/ath79/generic"
          SDK=$(wget -qO- "$BASE/" | grep -oE 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.zst' | head -n1)
          wget -q "$BASE/$SDK"
          tar --zstd -xf "$SDK"
          mv "${SDK%.tar.zst}" sdk

      - name: SDK root layout
        run: |
          echo "=== sdk root ==="
          ls -la sdk
          echo "=== sdk/target ==="
          ls sdk/target 2>/dev/null || echo "(no target dir)"
          echo "=== kernel build dir contents ==="
          ls -la sdk/build_dir/target-*/ | head -20
          echo "=== linux dir ==="
          ls -la sdk/build_dir/target-*/linux-* | head -30

      - name: Kernel config state
        run: |
          K=$(ls -d sdk/build_dir/target-*/linux-* | head -n1)
          echo "K=$K"
          for f in .config .config.set Module.symvers modules.order include/config/auto.conf include/generated/autoconf.h; do
            if [ -e "$K/$f" ]; then echo "PRESENT $f"; else echo "MISSING $f"; fi
          done
          echo "=== cfg80211 in kernel config ==="
          grep -E 'CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_USB=' "$K/.config" 2>/dev/null || echo "(no .config)"
          echo "=== vermagic ==="
          cat "$K/.vermagic" 2>/dev/null || echo "(none)"

      - name: Does SDK build kernel target
        run: |
          cd sdk
          make help 2>/dev/null | grep -E 'target/linux|package/' | head -20 || true